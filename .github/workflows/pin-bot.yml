name: pin-bot

on:
  # (H1) Manual dispatch ONLY: pin bumps are deliberate acts. Weekly auto-PRs
  # made "fresh hash merged" routine, eroding the review the pin exists for.
  # PRs carry the pin-bot label; branch protection requires a second reviewer.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  pin:
    name: Bump upstream installer hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run pin-installer.sh
        run: bash scripts/pin-installer.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet install.sh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR body (with upstream preview baked in)
        id: upstream_diff
        if: steps.diff.outputs.changed == 'true'
        run: |
          # (H1) Preview must show EXACTLY what install.sh pins: derive the URL
          # from install.sh so preview and pin can never diverge by origin.
          PAI_URL="$(grep '^PAI_INSTALLER_URL=' install.sh | head -1 | cut -d'"' -f2)"
          upstream_preview="$(curl -fsSL "${PAI_URL}" | head -100 || echo 'Failed to fetch')"
          # Build the FULL PR body here (shell DOES interpolate the preview) and
          # pass it via body-path below. A literal `body:` block never expands
          # $(...) — the preview would otherwise show up as the literal command.
          {
            printf '## Automated hash bump\n\n'
            printf '`scripts/pin-installer.sh` detected a new upstream SHA-256.\n\n'
            printf '**⚠️ REVIEWER ACTION REQUIRED:**\n'
            printf '1. Read the upstream installer preview below before merging.\n'
            printf '2. Verify the change is expected (routine update, not compromise).\n'
            printf '3. A second reviewer is required for `pin-bot`-labeled PRs (branch protection).\n\n'
            printf '<details>\n<summary>Upstream installer preview (first 100 lines)</summary>\n\n'
            printf '```bash\n'
            printf '%s\n' "${upstream_preview}"
            printf '```\n\n</details>\n\n---\n'
            printf '🤖 Opened by pin-bot workflow. Do **not** merge without reading the diff.\n'
          } > /tmp/pr-body.md

      - name: Open PR on hash change
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'pin: bump upstream installer hash'
          branch: pin-bot/bump-hashes
          delete-branch: true
          title: 'pin: bump upstream PAI installer + Bun hashes'
          labels: pin-bot
          body-path: /tmp/pr-body.md
