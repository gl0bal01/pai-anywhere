name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: bun test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  shellcheck:
    name: shellcheck -S warning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run shellcheck
        run: shellcheck -S warning install.sh uninstall.sh scripts/*.sh tests/*.sh extras/backup/pai-backup

  shell-tests:
    name: non-root shell safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Run non-root shell tests
        run: |
          bash tests/log-format.sh
          bash tests/pairing-code-leak.sh
          bash tests/reset-access-non-root.sh
          bash tests/sha256-mismatch.sh

  root-shell-tests:
    # Synthetic-manifest safety tests that need root but not systemd/network.
    # GitHub-hosted job containers run as root, so the in-test root gates pass.
    name: root shell safety tests (container)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install test dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq

      - name: uninstall-safety (AC-11 unowned-content contract)
        run: bash tests/uninstall-safety.sh

      - name: partial-install-rollback
        run: bash tests/partial-install-rollback.sh
